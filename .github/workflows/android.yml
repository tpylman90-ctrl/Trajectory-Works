name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.6.3
      BLENDER_VERSION: 5.2.2
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Blender
        run: |
          BLENDER_ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL "https://download.blender.org/release/Blender5.2/${BLENDER_ARCHIVE}" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo "/tmp/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --version | head -n 2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Godot Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Configure Android SDK paths for Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Install Godot and export templates
        run: |
          GODOT_ARCHIVE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          TEMPLATE_ARCHIVE="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          RELEASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "${RELEASE_URL}/${GODOT_ARCHIVE}" -o /tmp/godot.zip
          curl -fsSL "${RELEASE_URL}/${TEMPLATE_ARCHIVE}" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-bin "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          GODOT_BINARY="/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT_BINARY"
          ln -s "$GODOT_BINARY" /tmp/godot-bin/godot

      - name: Generate cannon GLB with Blender
        run: blender --background --factory-startup --python assets/blender/build_cannon.py

      - name: Verify generated asset
        run: test -s assets/generated/trajectory_cannon.glb

      - name: Validate and import Godot project
        run: |
          godot --version
          godot --headless --path . --editor --import
          godot --headless --path . --quit

      - name: Prepare release signing key
        run: |
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing Android signing secrets. Add the four ANDROID_* secrets listed in docs/ANDROID_SETUP.md, then rerun this workflow."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trajectory-works-release.p12"
          chmod 600 "$RUNNER_TEMP/trajectory-works-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/trajectory-works-release.p12" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/trajectory-works-release.p12" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Export signed Android APK
        run: |
          mkdir -p build
          sed -i "s#^version/code=.*#version/code=${GITHUB_RUN_NUMBER}#" export_presets.cfg
          sed -i "s#^version/name=.*#version/name=\"0.1.${GITHUB_RUN_NUMBER}\"#" export_presets.cfg
          godot --headless --verbose --path . --export-release Android build/Trajectory-Works.apk
          test -s build/Trajectory-Works.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-works-apk
          path: build/Trajectory-Works.apk
          if-no-files-found: error
          retention-days: 30
